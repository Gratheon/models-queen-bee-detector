[project]
name = "models-queen-bee-detector"
version = "0.1.0"
description = "Queen bee object detector training, evaluation, export, and HTTP inference service."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B905"]
