services:
  models-queen-bee-detector:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ENV_ID=prod
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://127.0.0.1:4318}
      - OTEL_SERVICE_NAME=models-queen-bee-detector
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment.name=prod,service.namespace=gratheon
      - HYPERDX_API_KEY=${HYPERDX_API_KEY:-}
    volumes:
      - ./weights:/app/weights:ro
    restart: unless-stopped
    network_mode: host
